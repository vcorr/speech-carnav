name: Build APK

# Builds the debug APK on every push and publishes it as the "spike-latest" pre-release,
# so it can be downloaded and installed straight from the phone.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The runner provides ANDROID_HOME, so settings.gradle.kts includes :app.
      - name: Unit tests and debug APK
        run: ./gradlew :core:test :app:assembleDebug --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk finnav-spike.apk

      - uses: actions/upload-artifact@v4
        with:
          name: finnav-spike-apk
          path: finnav-spike.apk

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete spike-latest --yes --cleanup-tag || true
          gh release create spike-latest finnav-spike.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "FinNav spike (latest build)" \
            --notes "Debug build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Download finnav-spike.apk on the phone and open it to install."
